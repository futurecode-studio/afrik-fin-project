<script>
        let currentStep = 1;

        function toggleSelection(element) {
            element.classList.toggle('active');
        }

        function nextStep() {
            if (currentStep === 1) {
                // Transition to Objectives
                document.getElementById('step-1').classList.add('hidden-step');
                
                setTimeout(() => {
                    document.getElementById('step-1').style.display = 'none';
                    document.getElementById('step-2').style.display = 'block';
                    
                    // Update Content
                    document.getElementById('onboarding-title').innerText = "Quels sont vos objectifs ?";
                    document.getElementById('onboarding-subtitle').innerText = "Dites-nous ce que vous souhaitez accomplir en priorité pour nous aider à personnaliser votre tableau de bord.";
                    
                    // Update UI State
                    document.getElementById('step-dot-1').classList.replace('bg-primary', 'bg-outline-variant');
                    document.getElementById('step-dot-2').classList.replace('bg-outline-variant', 'bg-primary');
                    document.getElementById('back-btn').classList.remove('hidden');
                    document.getElementById('next-btn').innerText = "Terminer l'installation";

                    setTimeout(() => {
                        document.getElementById('step-2').classList.remove('hidden-step');
                    }, 50);
                }, 400);
                
                currentStep = 2;
            } else {
                // Final Action
                const btn = document.getElementById('next-btn');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Configuration...';
                btn.disabled = true;
                btn.classList.add('opacity-80');
                
                setTimeout(() => {
                    window.location.href = "#dashboard"; // Simulate redirection
                    alert("Onboarding complété ! Votre expérience personnalisée est prête.");
                }, 1500);
            }
        }

        function prevStep() {
            if (currentStep === 2) {
                document.getElementById('step-2').classList.add('hidden-step');
                
                setTimeout(() => {
                    document.getElementById('step-2').style.display = 'none';
                    document.getElementById('step-1').style.display = 'block';
                    
                    // Update Content
                    document.getElementById('onboarding-title').innerText = "Personnalisez votre expérience";
                    document.getElementById('onboarding-subtitle').innerText = "Choisissez les domaines qui vous passionnent pour que nous puissions adapter nos services à votre profil financier.";
                    
                    // Update UI State
                    document.getElementById('step-dot-1').classList.replace('bg-outline-variant', 'bg-primary');
                    document.getElementById('step-dot-2').classList.replace('bg-primary', 'bg-outline-variant');
                    document.getElementById('back-btn').classList.add('hidden');
                    document.getElementById('next-btn').innerText = "Continuer";

                    setTimeout(() => {
                        document.getElementById('step-1').classList.remove('hidden-step');
                    }, 50);
                }, 400);
                
                currentStep = 1;
            }
        }
    </script>
